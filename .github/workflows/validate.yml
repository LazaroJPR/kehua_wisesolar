name: "HACS Action"

on:
  push:
  pull_request:

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: "actions/checkout@v4"

      - name: Run HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
